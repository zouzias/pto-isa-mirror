name: PR-pipeline_pto-isa

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: "cann"
  repo_name: "pto-isa"
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  TARGET_BRANCH: ${{atomgit.base_ref}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_path: "${{ vars.OBS_PATH }}/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    select: selected_by_default
    jobs:
      JOB_pre:
        name: Test_pre_pipeline
        steps:
          - name: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@master
            with:
              owner: ${{ env.org_name }}
              repo: ${{ env.repo_name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: ${{ vars.APPLY_LABEL }}
          - name: associate-pr-comment
            uses: associate-pr-comment
            if: env.online == 'true'
        runs-on: [dedicate-hosted, x64, small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: 'pto-isa'
              target_branch: ${{ env.TARGET_BRANCH }}
              repo_url: ${{ vars.CI_PATH }}
          -
            name: show_output
            run: |
              echo "Compile_Ascend_X86: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
              echo ${org_name}
        if: "${{ default() }}"
        runs-on: ["dedicate-hosted", "x64", "small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pr:
        name: Test_get-pr
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{ secrets.GIT_TOKEN }}
          -
            name: get_pr
            identifier: get_pr
            uses: cann/.gitcode/actions/get-pr@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              target_branch: ${{ env.TARGET_BRANCH }}
              owner: ${{ env.org_name }}
              repo: ${{ env.repo_name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              git_token: ${{ secrets.GIT_TOKEN }}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/pr_filelist.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_mod.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_precommit.txt
                ${{ steps.process_checkout.outputs.path }}/update_file_detail.txt
                ${{ steps.process_checkout.outputs.path }}/gitdiff.txt
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on:
        - default
      JOB_shell:
        name: Test_get-shell
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: master
              token: ${{ secrets.GIT_TOKEN }}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/*
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on:
        - default
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    select: selected_by_default
    jobs:
      Compile_Ascend_X86:
        name: Compile_Ascend_X86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86'
          package_name: 'cann-pto-isa_linux-x86_64.run'
          arch: 'x64'
          spec: 'large'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
      Compile_Ascend_ARM:
        name: Compile_Ascend_ARM
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM'
          package_name: 'cann-pto-isa_linux-aarch64.run'
          arch: 'arm64'
          spec: 'xlarge'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      Compile_Ascend_X86_A5:
        name: Compile_Ascend_X86_A5
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_A5'
          package_name: 'cann-pto-isa_linux-x86_64-A5.run'
          arch: 'x64'
          spec: 'large'
          ge_st_rt2: 'A5'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_A5_ubuntu24 }}
      Compile_Ascend_ARM_A5:
        name: Compile_Ascend_ARM_A5
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_A5'
          package_name: 'cann-pto-isa_linux-aarch64-A5.run'
          arch: 'arm64'
          spec: 'xlarge'
          ge_st_rt2: 'A5'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_A5 }}
      JOB_codecheck:
        name: CodeCheck
        uses: .gitcode/workflows/codecheck_action.yml
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
  stage3:
    name: UT
    select: selected_by_default
    jobs:
      UT_Test:
        name: UT_Test
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: ''
          task_name: 'UT_Test'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      UT_Test_automode_A3:
        name: UT_Test_automode_A3
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: ''
          task_name: 'UT_Test_automode_A3'
          ge_st_rt2: 'A3'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_A3 }}
      UT_Test_automode_A5:
        name: UT_Test_automode_A5
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: ''
          task_name: 'UT_Test_automode_A5'
          ge_st_rt2: 'A5'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_A5 }}
    pre:
    - type: auto
  stage5:
    name: PreSmoke
    jobs:
      PreSmoke_A2_part1:
        name: PreSmoke_A2_part1
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download pr files
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
                set -e
                # set env
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                export download_path=${{ steps.process_download.outputs.download-path }}
                export package_name=${{jobs.Compile_Ascend_ARM_ubuntu24.outputs.package_name}}
                export obs_path=${{env.obs_path}}
                export repo_name=${{env.repo_name}}
                export obs_smoke_path=${{ env.obs_smoke_path }}
                export pr_id=${{ env.MERGE_ID }}
                export AK=${{secrets.AK}}
                export SK=${{secrets.SK}}
                export ST_PART=1
                bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/
        if: "${{ default() }}"
        runs-on: ['self-hosted','npu=1','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.PreSmoke_npupool }}

      PreSmoke_A2_part2:
        name: PreSmoke_A2_part2
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download pr files
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
                set -e
                # set env
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                export download_path=${{ steps.process_download.outputs.download-path }}
                export package_name=${{jobs.Compile_Ascend_ARM_ubuntu24.outputs.package_name}}
                export obs_path=${{env.obs_path}}
                export repo_name=${{env.repo_name}}
                export obs_smoke_path=${{ env.obs_smoke_path }}
                export pr_id=${{ env.MERGE_ID }}
                export AK=${{secrets.AK}}
                export SK=${{secrets.SK}}
                export ST_PART=2
                bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/
        if: "${{ default() }}"
        runs-on: ['self-hosted','npu=1','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.PreSmoke_npupool }}
    pre:
    - type: auto
    fail-fast: true
post:
  jobs:
    job_post:
      name: Test_finish
      steps:
        -
          name: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@master
          with:
            owner: ${{ env.org_name }}
            repo: ${{ env.repo_name }}
            run_id: ${{atomgit.workflow_run_id}}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ env.MERGE_ID }}
            apply_label: ${{ vars.APPLY_LABEL }}
      runs-on: [dedicate-hosted, x64, small]
      container:
        image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.codecheck }}
