<text x="58" y="652" class="mono" text-anchor="start">Destination group pitch = Rows × 8 int32 elements; row stride = 8 elements.</text>
<text x="58" y="683" class="small" text-anchor="start">NoQuant + NoRelu; valid columns round up to 8. Outer phase is forwarded unchanged.</text>
