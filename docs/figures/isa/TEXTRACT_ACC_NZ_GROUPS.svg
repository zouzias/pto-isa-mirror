<text x="1021" y="310" class="small" text-anchor="middle">offset 512 elements</text>
<text x="58" y="344" class="body" text-anchor="start">Group starts = group × Rows × 32 elements; each group reserves 32 columns.</text>
<text x="58" y="379" class="body" text-anchor="start">Only 8 valid rows are written. A final 16-column group keeps its other 16 columns unchanged.</text>
<text x="58" y="421" class="mono" text-anchor="start">Outer STPhase::Final → first group: Partial; last group: Final.</text>
