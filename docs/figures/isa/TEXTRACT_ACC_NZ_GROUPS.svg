<title id="title">TEXTRACT: A5 Acc → Mat NZ groups</title>
<desc id="desc">For float to half or bfloat16 NZ1024, each destination group has 32 columns. A 48-column window becomes one full group and one half-filled group, with Partial then Final flags for an outer Final phase. Int32 NZ512 channel splitting instead maps a 16-column source group to two 8-column destination groups with bits unchanged.</desc>
