<title id="title">TLOAD: gap, stride and per-burst fallback</title>
<desc id="desc">Stride measures start to start; gap measures end to next start. The register helper uses one multi-burst DMA up to 2^40 minus 1 bytes, and one DMA per burst above that boundary. All address offsets retain 64-bit precision.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; } .title { font-size: 30px; font-weight: 700; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .small { font-size: 16px; fill: #334155; } .mono { font-family: monospace; font-size: 18px; }</style>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="36" y="46" class="title" text-anchor="start">TLOAD: gap, stride and per-burst fallback</text>
<text x="36" y="80" class="body" text-anchor="start">Shared register DMA helper: A5/A6 and Kirin9030/KirinDev0000 callers. Addresses are in bytes.</text>
<rect x="36" y="108" width="1128" height="236" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="58" y="142" class="heading" text-anchor="start">1. Source addresses (schematic, not to scale)</text>
<rect x="100" y="208" width="180" height="50" rx="3" fill="#EDE7FF" stroke="#6A47C4" stroke-width="1.5"/>
<text x="190" y="240" class="body" text-anchor="middle">burst 0: L bytes</text>
<text x="100" y="283" class="mono" text-anchor="start">src</text>
<rect x="450" y="208" width="180" height="50" rx="3" fill="#DDF4F2" stroke="#6A47C4" stroke-width="1.5"/>
<text x="540" y="240" class="body" text-anchor="middle">burst 1: L bytes</text>
<text x="450" y="283" class="mono" text-anchor="start">src + S</text>
<rect x="800" y="208" width="180" height="50" rx="3" fill="#FFF0DD" stroke="#6A47C4" stroke-width="1.5"/>
<text x="890" y="240" class="body" text-anchor="middle">burst 2: L bytes</text>
<text x="800" y="283" class="mono" text-anchor="start">src + 2S</text>
<path d="M100,183 L450,183" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="275" y="172" class="body" text-anchor="middle">stride S</text>
<path d="M280,230 L450,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="365" y="215" class="small" text-anchor="middle">gap G</text>
<text x="58" y="322" class="mono" text-anchor="start">S = L + G      |      src(i) = src + i × S      |      dst(i) = dst + i × D</text>
<rect x="36" y="366" width="548" height="316" rx="10" fill="#F0EDFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="608" y="366" width="556" height="316" rx="10" fill="#F0FAF8" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="58" y="402" class="heading" text-anchor="start">2a. S ≤ 2^40 − 1 bytes</text>
<text x="630" y="402" class="heading" text-anchor="start">2b. S ≥ 2^40 bytes</text>
<text x="58" y="441" class="body" text-anchor="start">One native multi-burst DMA</text>
<text x="58" y="478" class="mono" text-anchor="start">nBurst = N; length = L</text>
<text x="58" y="511" class="mono" text-anchor="start">encoded strides = S, D</text>
<text x="58" y="560" class="body" text-anchor="start">Hardware advances to each burst.</text>
<text x="58" y="594" class="body" text-anchor="start">The helper returns directly.</text>
<text x="58" y="647" class="small" text-anchor="start">The boundary value still uses this path.</text>
<text x="630" y="441" class="body" text-anchor="start">N single-burst DMA operations</text>
<text x="630" y="478" class="mono" text-anchor="start">for i = 0 .. N − 1:</text>
<text x="652" y="511" class="mono" text-anchor="start">copy src + i×S → dst + i×D</text>
<text x="652" y="544" class="mono" text-anchor="start">nBurst = 1; length = L</text>
<text x="652" y="577" class="mono" text-anchor="start">encoded strides = 0, 0</text>
<text x="630" y="616" class="body" text-anchor="start">Software retains the full address offsets.</text>
<text x="630" y="647" class="small" text-anchor="start">64-bit arithmetic; no stride truncation.</text>
<text x="36" y="718" class="body" text-anchor="start">A5 only: compiler-known N ≤ 8 uses bounded unrolling; dynamic/larger N keeps the loop.</text>
<text x="36" y="746" class="small" text-anchor="start">D = destination start-to-start stride. Other encoded fields must still fit their own limits.</text>
</svg>
