<rect x="40" y="580" width="1320" height="200" class="procBox" />
<text x="56" y="604" class="procTitle">Procedure (indexed form, per-row)</text>
<text x="56" y="628" class="procText" xml:space="preserve">
  <tspan x="56" dy="0">for r in range(validRows):</tspan>
  <tspan x="56" dy="14">  # Read dynamic column counts from index tiles (stored as byte counts)</tspan>
  <tspan x="56" dy="14">  idx0Num = *(idx0Ptr + r * idx0Stride) / sizeof(idxType)  # C0 for this row</tspan>
  <tspan x="56" dy="14">  idx1Num = *(idx1Ptr + r * idx1Stride) / sizeof(idxType)  # C1 for this row</tspan>
  <tspan x="56" dy="14">  if (dstIdx):  dstIdxNum = min(idx0Num + idx1Num, dstValidCol)  # output total count</tspan>
  <tspan x="56" dy="14">              *(dstIdxPtr + r * dstIdxStride) = dstIdxNum * sizeof(idxType)</tspan>
  <tspan x="56" dy="14">  # Apply same concatenation logic as basic form, but with row-specific counts</tspan>
  <tspan x="56" dy="14">  sreg0 = min(idx0Num, dstValidCol)  # effective C0</tspan>
  <tspan x="56" dy="14">  sreg1 = min(idx1Num, dstValidCol - sreg0)  # effective C1 (clamped)</tspan>
  <tspan x="56" dy="14">  # Phase 1: vlds(src0) → vsts(dst) for sreg0 columns</tspan>
  <tspan x="56" dy="14">  # Phase 2: mem_bar → vlds(src1) → vscatter(dst at offset sreg0)</tspan>
</text>
<text x="56" y="772" class="meta">Index tiles store byte counts; divide by sizeof(dtype) to get element counts. dstIdx.ValidRow must be 1. idx types: int8/16/32, uint8/16/32.</text>
</svg>