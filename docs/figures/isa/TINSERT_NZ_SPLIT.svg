<title id="title">TINSERT: NZ column blocks and SPLIT2 / SPLIT4</title>
<desc id="desc">Five 16-column NZ blocks are copied in order. SPLIT2 groups them as two then three blocks; SPLIT4 groups them as one, one, one, then two. Each burst copies 32 aligned rows including tails. Source block pitch is 1024 bytes and destination block pitch is 1536 bytes for CompactMode Null.</desc>
