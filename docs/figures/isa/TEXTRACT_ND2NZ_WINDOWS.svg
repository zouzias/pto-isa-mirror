<title id="title">TEXTRACT: two ND windows → two NZ tiles</title>
<desc id="desc">Two independently positioned source windows, at row zero column zero and row four column thirty-two, are extracted into separate NZ destinations. Each destination contains two 16-column blocks. The diagram shows the 16-row block pitch and the 17-row pitch used by RowPlusOne.</desc>
