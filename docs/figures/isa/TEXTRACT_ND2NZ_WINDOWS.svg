<text x="58" y="621" class="heading" text-anchor="start">Element mapping (offsets in half elements)</text>
<text x="58" y="656" class="mono" text-anchor="start">dst_k[ floor(c/16) × P × 16 + r × 16 + c%16 ]</text>
<text x="58" y="688" class="mono" text-anchor="start">    = src[ (indexRow_k + r) × 64 + indexCol_k + c ]</text>
<text x="58" y="726" class="small" text-anchor="start">0 ≤ r &lt; 4; 0 ≤ c &lt; 32. Plain NZ: P = ceil16(4) = 16 → 512 B block pitch.</text>
<text x="58" y="754" class="small" text-anchor="start">RowPlusOne: P = 17 → 544 B block pitch; the extra row between blocks is not written.</text>
