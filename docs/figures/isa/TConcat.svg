<text x="40" y="46" class="title">TConcat</text>
<text x="40" y="72" class="subtitle">Concatenate two tiles horizontally along the column dimension.</text>
<text x="40" y="92" class="meta">Template: reshape_move</text>
<text x="1160" y="92" class="meta" text-anchor="end">Legend: blue=src0 region; orange=src1 region; dashed=valid rows/cols; shaded=masked</text>
<line x1="36" y1="104" x2="1164" y2="104" stroke="#e2e8f0" stroke-width="1.5" />
<text x="600" y="140" class="subtitle" text-anchor="middle" fill="#515151">dst[r, 0:C0] = src0[r, :]; dst[r, C0:C0+C1] = src1[r, :]</text>

