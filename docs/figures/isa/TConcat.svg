<rect x="40" y="502" width="1120" height="194" class="procBox" />
<text x="56" y="528" class="procTitle">Procedure (conceptual)</text>
<text x="56" y="554" class="procText" xml:space="preserve">
  <tspan x="56" dy="0">for r in validRows:</tspan>
  <tspan x="56" dy="16">  for c in range(validCols0):</tspan>
  <tspan x="56" dy="16">    dst[r, c] = src0[r, c]</tspan>
  <tspan x="56" dy="16">  for c in range(validCols1):</tspan>
  <tspan x="56" dy="16">    dst[r, validCols0 + c] = src1[r, c]</tspan>
  <tspan x="56" dy="16"># Result: dst.validCol == src0.validCol + src1.validCol</tspan>
</text>
<text x="56" y="680" class="meta">Note: TConcat horizontally concatenates two tiles; valid rows must match; valid cols of dst = sum of src0 and src1 valid cols.</text>
</svg>