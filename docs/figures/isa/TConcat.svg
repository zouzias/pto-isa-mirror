<text x="530" y="316" class="opText" font-size="9px" text-anchor="middle">TCON</text>
<text x="530" y="328" class="opText" font-size="9px" text-anchor="middle">CAT</text>

<path d="M 240 290 L 240 320 L 508 320" class="arrowBlue" marker-end="url(#arrowBlue)" />
<path d="M 830 290 L 830 320 L 552 320" class="arrowOrange" marker-end="url(#arrowOrange)" />
