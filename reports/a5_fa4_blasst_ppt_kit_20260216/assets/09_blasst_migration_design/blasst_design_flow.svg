<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-size="40" font-family="Arial">BLASST Skip-Softmax A5 Migration: Target and Design</text>

  <rect x="80" y="140" width="1240" height="150" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="120" y="195" fill="#0c4a6e" font-size="28" font-family="Arial">Goal: Compile pass + simulation startup + sync safety + skip observability</text>
  <text x="120" y="240" fill="#0c4a6e" font-size="24" font-family="Arial">Constraint: keep fixed pipeline handshake (QK -> P -> PV -> GU) unchanged</text>

  <rect x="80" y="330" width="260" height="120" rx="10" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="130" y="400" fill="#1e3a8a" font-size="28" font-family="Arial">QK</text>
  <rect x="390" y="330" width="260" height="120" rx="10" fill="#93c5fd" stroke="#3b82f6"/>
  <text x="500" y="400" fill="#1e3a8a" font-size="28" font-family="Arial">P</text>
  <rect x="700" y="330" width="260" height="120" rx="10" fill="#60a5fa" stroke="#2563eb"/>
  <text x="795" y="400" fill="#ffffff" font-size="28" font-family="Arial">PV</text>
  <rect x="1010" y="330" width="260" height="120" rx="10" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="1110" y="400" fill="#ffffff" font-size="28" font-family="Arial">GU</text>

  <line x1="340" y1="390" x2="390" y2="390" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="650" y1="390" x2="700" y2="390" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="960" y1="390" x2="1010" y2="390" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="360" y="500" width="340" height="220" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="390" y="550" fill="#14532d" font-size="26" font-family="Arial">Skip Decision (P stage)</text>
  <text x="390" y="595" fill="#14532d" font-size="22" font-family="Arial">if local_max - global_max &lt;= delta</text>
  <text x="390" y="635" fill="#14532d" font-size="22" font-family="Arial">or force/ratio-force enabled</text>
  <text x="390" y="675" fill="#14532d" font-size="22" font-family="Arial">then x_exp=0, local_sum=0, exp_max=1</text>

  <rect x="760" y="500" width="500" height="220" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="790" y="550" fill="#78350f" font-size="26" font-family="Arial">Observability and Controls</text>
  <text x="790" y="595" fill="#78350f" font-size="22" font-family="Arial">- BLASST_SKIP_SOFTMAX_ENABLE/FORCE/DELTA</text>
  <text x="790" y="635" fill="#78350f" font-size="22" font-family="Arial">- BLASST_SKIP_SOFTMAX_FORCE_RATIO</text>
  <text x="790" y="675" fill="#78350f" font-size="22" font-family="Arial">- p_total_cnt / p_skip_cnt summary</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
