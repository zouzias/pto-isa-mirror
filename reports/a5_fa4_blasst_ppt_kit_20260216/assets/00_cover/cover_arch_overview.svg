<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#0f172a"/>
  <text x="60" y="90" fill="#e2e8f0" font-size="44" font-family="Arial">FA4 + BLASST on A5 NPU</text>
  <text x="60" y="140" fill="#94a3b8" font-size="24" font-family="Arial">Migration, Validation, and Performance Analysis</text>

  <rect x="80" y="220" width="580" height="500" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="110" y="270" fill="#f8fafc" font-size="28" font-family="Arial">GPU CUTE (Warp-Specialized, Overlapped)</text>

  <rect x="120" y="315" width="210" height="70" rx="8" fill="#1d4ed8"/>
  <text x="152" y="358" fill="#ffffff" font-size="22" font-family="Arial">Producer Load</text>
  <rect x="360" y="315" width="180" height="70" rx="8" fill="#0ea5e9"/>
  <text x="405" y="358" fill="#ffffff" font-size="22" font-family="Arial">MMA QK</text>
  <rect x="250" y="420" width="190" height="70" rx="8" fill="#06b6d4"/>
  <text x="282" y="463" fill="#ffffff" font-size="22" font-family="Arial">Online Softmax</text>
  <rect x="460" y="420" width="150" height="70" rx="8" fill="#14b8a6"/>
  <text x="492" y="463" fill="#ffffff" font-size="22" font-family="Arial">MMA PV</text>

  <line x1="330" y1="350" x2="360" y2="350" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="385" x2="350" y2="420" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="440" y1="455" x2="460" y2="455" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="535" y1="420" x2="525" y2="385" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="120" y="560" fill="#cbd5e1" font-size="22" font-family="Arial">- Not a strict linear QK-P-PV-GU pipeline</text>
  <text x="120" y="600" fill="#cbd5e1" font-size="22" font-family="Arial">- Producer/Consumer warp-groups with overlap</text>
  <text x="120" y="640" fill="#cbd5e1" font-size="22" font-family="Arial">- O update relies on MMA accumulator semantics</text>

  <rect x="740" y="220" width="580" height="500" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="770" y="270" fill="#f8fafc" font-size="28" font-family="Arial">A5 NPU (Fixed Stage Handshake)</text>
  <rect x="770" y="315" width="120" height="70" rx="8" fill="#1d4ed8"/>
  <text x="810" y="358" fill="#ffffff" font-size="24" font-family="Arial">QK</text>
  <rect x="910" y="315" width="120" height="70" rx="8" fill="#0ea5e9"/>
  <text x="935" y="358" fill="#ffffff" font-size="24" font-family="Arial">P</text>
  <rect x="1050" y="315" width="120" height="70" rx="8" fill="#06b6d4"/>
  <text x="1090" y="358" fill="#ffffff" font-size="24" font-family="Arial">PV</text>
  <rect x="1190" y="315" width="100" height="70" rx="8" fill="#14b8a6"/>
  <text x="1217" y="358" fill="#ffffff" font-size="24" font-family="Arial">GU</text>
  <line x1="890" y1="350" x2="910" y2="350" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1030" y1="350" x2="1050" y2="350" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1170" y1="350" x2="1190" y2="350" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="770" y="560" fill="#cbd5e1" font-size="22" font-family="Arial">- Keep TSync-safe fixed stage protocol</text>
  <text x="770" y="600" fill="#cbd5e1" font-size="22" font-family="Arial">- Migrate skip logic with compile/sim priority</text>
  <text x="770" y="640" fill="#cbd5e1" font-size="22" font-family="Arial">- Validate via timeline / swimlane / phase analysis</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
